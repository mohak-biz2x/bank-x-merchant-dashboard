<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Direct Debit Agreement - Signed Successfully</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background-color: #111827;
            color: #f9fafb;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .container {
            max-width: 480px;
            width: 100%;
            text-align: center;
        }

        .icon-wrapper {
            width: 80px;
            height: 80px;
            margin: 0 auto 24px;
            background-color: #065f46;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: scaleIn 0.4s ease-out;
        }

        @keyframes scaleIn {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .icon-wrapper svg {
            width: 40px;
            height: 40px;
            stroke: #34d399;
            stroke-width: 2.5;
            fill: none;
        }

        .card {
            background-color: #1f2937;
            border: 1px solid #374151;
            border-radius: 12px;
            padding: 40px 32px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.3);
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            color: #f9fafb;
            margin-bottom: 12px;
        }

        .subtitle {
            font-size: 1rem;
            color: #9ca3af;
            margin-bottom: 32px;
            line-height: 1.6;
        }

        .info-box {
            background-color: #1e3a5f;
            border: 1px solid #2563eb;
            border-radius: 8px;
            padding: 16px 20px;
            margin-bottom: 32px;
            display: flex;
            align-items: flex-start;
            gap: 12px;
            text-align: left;
        }

        .info-box svg {
            width: 20px;
            height: 20px;
            stroke: #60a5fa;
            flex-shrink: 0;
            margin-top: 2px;
        }

        .info-box p {
            font-size: 0.875rem;
            color: #bfdbfe;
            line-height: 1.5;
        }

        .divider {
            height: 1px;
            background-color: #374151;
            margin: 24px 0;
        }

        .footer-text {
            font-size: 0.8125rem;
            color: #6b7280;
            line-height: 1.5;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background-color: #064e3b;
            border: 1px solid #065f46;
            border-radius: 20px;
            padding: 6px 14px;
            font-size: 0.8125rem;
            color: #6ee7b7;
            margin-bottom: 24px;
        }

        .badge svg {
            width: 14px;
            height: 14px;
            stroke: #6ee7b7;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="icon-wrapper">
                <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="20 6 9 17 4 12"></polyline>
                </svg>
            </div>

            <div class="badge">
                <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="2">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                </svg>
                Verified via UAE Pass
            </div>

            <h1>Direct Debit Agreement Signed Successfully</h1>

            <p class="subtitle">
                Your Direct Debit Agreement has been signed and verified through UAE Pass.
            </p>

            <div class="info-box">
                <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="2">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="12" y1="16" x2="12" y2="12"></line>
                    <line x1="12" y1="8" x2="12.01" y2="8"></line>
                </svg>
                <p>
                    Please return to your <strong>MAL Portal</strong> window and refresh the signing status to continue with the remaining steps.
                </p>
            </div>

            <div class="divider"></div>

            <p class="footer-text">
                You may safely close this window now.
            </p>
        </div>
    </div>
</body>
</html>
